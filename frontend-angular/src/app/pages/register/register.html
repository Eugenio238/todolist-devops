<div class="container">
  <div
    class="min-vh-100 d-flex align-items-center justify-content-center"
  >
    <div class="card border-0 shadow-sm" style="max-width: 450px; width: 100%;">

      <div class="card-body p-4">

        <div class="text-center mb-4">

          <i class="bi bi-person-plus fs-1 text-primary"></i>

          <h1 class="h3 mt-2">
            Créer un compte
          </h1>

          <p class="text-secondary">
            Inscrivez-vous pour gérer vos tâches
          </p>

        </div>

        @if (auth.error()) {
          <div class="alert alert-danger">
            {{ auth.error() }}
          </div>
        }

        <form (ngSubmit)="handleSubmit()">

          <div class="mb-3">

            <label
              for="name"
              class="form-label"
            >
              Nom
            </label>

            <input
              id="name"
              name="name"
              type="text"
              class="form-control"
              [(ngModel)]="name"
              placeholder="Votre nom"
              required
            />

          </div>

          <div class="mb-3">

            <label
              for="email"
              class="form-label"
            >
              Email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              class="form-control"
              [(ngModel)]="email"
              placeholder="exemple@email.com"
              required
            />

          </div>

          <div class="mb-3">

            <label
              for="password"
              class="form-label"
            >
              Mot de passe
            </label>

            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              [(ngModel)]="password"
              placeholder="Minimum 8 caractères"
              minlength="8"
              required
            />

          </div>

          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="auth.isLoading()"
          >

            @if (auth.isLoading()) {
              <span
                class="spinner-border spinner-border-sm me-2"
              ></span>

              Inscription...
            } @else {
              <i class="bi bi-person-plus me-2"></i>
              Créer mon compte
            }

          </button>

        </form>

        <div class="text-center mt-4">

          <span class="text-secondary">
            Vous avez déjà un compte ?
          </span>

          <a
            routerLink="/login"
            class="text-decoration-none ms-1"
          >
            Se connecter
          </a>

        </div>

      </div>

    </div>
  </div>
</div>
